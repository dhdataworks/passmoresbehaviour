<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Behaviour Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
:root{
  --bg:#E9ECF6; --surface:#FFFFFF; --canvas:#F6F7FC;
  --ink:#1B2137; --ink2:#5C6784; --ink3:#98A1B8; --line:#EAEDF5; --line2:#F2F4F9;
  --blue:#3A6FF7; --blue-l:#EBF1FE; --blue-d:#2D57C8;
  --green:#1FB574; --green-l:#E7F7F0;
  --amber:#F2A93B; --amber-l:#FDF3E4;
  --red:#E2574C; --red-l:#FDEDEC;
  --violet:#7C5CFC;
  --heat:226,87,76;
  --r:16px;
  --sh:0 1px 2px rgba(27,33,55,.04), 0 10px 30px -14px rgba(27,33,55,.18);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{
  background:linear-gradient(165deg,#EEF0F8 0%,#E4E8F5 100%) fixed;
  color:var(--ink); font-family:'Plus Jakarta Sans',system-ui,-apple-system,sans-serif;
  font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased;
}
.num{font-variant-numeric:tabular-nums}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:6px}

/* ---------- shell ---------- */
.app{
  max-width:1640px; margin:18px auto; min-height:calc(100vh - 36px);
  background:var(--surface); border-radius:24px; box-shadow:var(--sh);
  display:grid; grid-template-columns:238px 1fr; overflow:hidden;
}
.rail{border-right:1px solid var(--line);padding:22px 16px;display:flex;flex-direction:column;gap:6px}
.brand{display:flex;align-items:center;gap:11px;padding:0 8px 22px}
.mark{width:38px;height:38px;border-radius:11px;background:linear-gradient(140deg,var(--blue),var(--violet));
  display:grid;place-items:center;color:#fff;font-weight:800;font-size:15px;letter-spacing:-.02em}
.brand b{font-size:16px;font-weight:800;letter-spacing:-.02em;display:block;line-height:1.2}
.brand span{font-size:11px;color:var(--ink3);font-weight:500}
.navlab{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);padding:14px 10px 6px}
.nav{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:11px;border:0;background:none;
  cursor:pointer;color:var(--ink2);font-size:13.5px;font-weight:600;width:100%;text-align:left;transition:.14s}
.nav:hover{background:var(--canvas);color:var(--ink)}
.nav[aria-current="true"]{background:var(--blue-l);color:var(--blue-d)}
.nav svg{width:18px;height:18px;flex:none;stroke-width:1.9}
.railfoot{margin-top:auto;background:var(--canvas);border-radius:14px;padding:13px}
.railfoot .st{display:flex;align-items:center;gap:8px;font-size:11.5px;font-weight:600;color:var(--ink2)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ink3);flex:none}
.dot.on{background:var(--green)}.dot.warn{background:var(--amber)}.dot.err{background:var(--red)}
.railfoot p{margin:6px 0 10px;font-size:11px;color:var(--ink3);line-height:1.45}

/* ---------- main ---------- */
main{background:var(--canvas);min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:flex-start;gap:16px;padding:22px 26px 0;flex-wrap:wrap}
.top h1{margin:0;font-size:21px;font-weight:800;letter-spacing:-.03em}
.top p{margin:2px 0 0;font-size:13px;color:var(--ink3)}
.grow{flex:1}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink2);font-size:12.5px;font-weight:600;
  padding:8px 13px;border-radius:10px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;transition:.14s}
.btn:hover{border-color:#D8DEEC;color:var(--ink)}
.btn.pri{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.pri:hover{background:var(--blue-d);border-color:var(--blue-d)}
.btn svg{width:15px;height:15px;stroke-width:2}

/* filters */
.filters{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:16px 26px 0}
.sel{position:relative}
.sel select{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:10px;
  padding:8px 30px 8px 12px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--ink);cursor:pointer;min-height:36px}
.sel::after{content:'';position:absolute;right:12px;top:50%;width:6px;height:6px;border-right:1.8px solid var(--ink3);
  border-bottom:1.8px solid var(--ink3);transform:translateY(-70%) rotate(45deg);pointer-events:none}
.pill{border:1px solid var(--line);background:var(--surface);color:var(--ink2);font-size:12px;font-weight:600;
  padding:8px 13px;border-radius:999px;cursor:pointer;transition:.14s}
.pill:hover{border-color:#D8DEEC;color:var(--ink)}
.pill[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.divider{width:1px;height:22px;background:var(--line);margin:0 3px}
.searchbox{position:relative;display:flex;align-items:center}
.searchbox input{border:1px solid var(--line);border-radius:10px;padding:8px 12px 8px 32px;font-family:inherit;
  font-size:12.5px;min-height:36px;width:190px;background:var(--surface);color:var(--ink)}
.searchbox svg{position:absolute;left:10px;width:14px;height:14px;stroke:var(--ink3);stroke-width:2}

.body{padding:18px 26px 30px;flex:1}
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--sh);padding:20px}
.card+.card{margin-top:16px}
.ch{display:flex;align-items:flex-start;gap:14px;margin-bottom:16px}
.ch h2{margin:0;font-size:15px;font-weight:700;letter-spacing:-.02em}
.ch p{margin:2px 0 0;font-size:12px;color:var(--ink3)}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,1fr)}
.g2{grid-template-columns:1fr 1fr}
.g21{grid-template-columns:1.6fr 1fr}
@media(max-width:1180px){.g4{grid-template-columns:repeat(2,1fr)}.g2,.g21{grid-template-columns:1fr}}

/* kpi */
.kpi{background:var(--surface);border-radius:var(--r);box-shadow:var(--sh);padding:17px 18px 0;overflow:hidden;
  display:flex;flex-direction:column}
.kpi .ic{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;margin-bottom:11px}
.kpi .ic svg{width:17px;height:17px;stroke-width:2}
.kpi .v{font-size:29px;font-weight:800;letter-spacing:-.035em;line-height:1.05}
.kpi .l{font-size:12.5px;color:var(--ink3);font-weight:500;margin-top:1px}
.kpi .d{font-size:11.5px;font-weight:700;margin-top:8px;display:inline-flex;align-items:center;gap:4px}
.up{color:var(--red)}.down{color:var(--green)}.flat{color:var(--ink3)}
.kpi .spark{margin:10px -18px -1px}

/* heat matrix */
.tablewrap{overflow:auto;max-height:min(72vh,720px);border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table.matrix{border-collapse:separate;border-spacing:0;width:100%}
table.matrix th,table.matrix td{padding:0;font-size:11.5px}
table.matrix thead th{position:sticky;top:0;z-index:3;background:#FAFBFE;border-bottom:1px solid var(--line);
  font-weight:700;color:var(--ink2);font-size:10.5px;letter-spacing:.02em;padding:9px 4px;text-align:center;white-space:nowrap}
table.matrix thead th.name{left:0;z-index:4;text-align:left;padding-left:14px;min-width:238px;background:#FAFBFE}
table.matrix tbody td.name{position:sticky;left:0;z-index:2;background:var(--surface);border-right:1px solid var(--line);
  text-align:left;padding:7px 10px 7px 14px;font-weight:600;font-size:12.5px;color:var(--ink);min-width:238px;max-width:280px}
table.matrix tbody td.name small{display:block;font-weight:500;color:var(--ink3);font-size:10.5px}
table.matrix tbody td{text-align:center;border-bottom:1px solid var(--line2);height:30px;min-width:34px}
table.matrix tbody tr:hover td{background-image:linear-gradient(rgba(58,111,247,.05),rgba(58,111,247,.05))}
table.matrix tbody tr:hover td.name{background-image:linear-gradient(rgba(58,111,247,.05),rgba(58,111,247,.05))}
.cellv{display:block;padding:6px 3px;font-variant-numeric:tabular-nums;font-weight:600}
td.tot,th.tot{background:#F7F9FD;font-weight:800;border-left:1px solid var(--line);min-width:52px}
.trendcell{min-width:74px;padding:0 8px!important}
tr.totals td{background:#F2F5FB;font-weight:800;border-top:1px solid var(--line);position:sticky;bottom:0;z-index:1}
tr.totals td.name{background:#F2F5FB;z-index:3}
.scale{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--ink3);font-weight:600}
.scale i{width:22px;height:11px;border-radius:2px;display:block}

/* generic tables */
table.data{width:100%;border-collapse:collapse}
table.data th{font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--ink3);
  text-align:right;padding:0 8px 9px;border-bottom:1px solid var(--line)}
table.data th:first-child{text-align:left;padding-left:0}
table.data td{padding:9px 8px;border-bottom:1px solid var(--line2);text-align:right;font-size:13px;font-weight:600}
table.data td:first-child{text-align:left;font-weight:600;padding-left:0}
table.data tr:last-child td{border-bottom:0}
.track{background:var(--line2);height:7px;border-radius:99px;min-width:60px;overflow:hidden}
.track span{display:block;height:100%;border-radius:99px;background:var(--blue)}
.mix{display:flex;height:8px;width:82px;border-radius:99px;overflow:hidden;background:var(--line2);margin-left:auto}
.mix i{height:100%}
.tagset{display:flex;gap:5px;flex-wrap:wrap}
.tg{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--canvas);color:var(--ink2)}

/* data view */
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.field label{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--ink3)}
.field input{border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-family:ui-monospace,monospace;
  font-size:12px;background:var(--canvas);color:var(--ink);width:100%}
.msg{font-size:12.5px;margin-top:12px;padding:10px 13px;border-radius:11px;display:none;font-weight:600}
.msg.show{display:block}
.msg.ok{background:var(--green-l);color:#146848}
.msg.err{background:var(--red-l);color:#9C332A}
.steps{margin:10px 0 16px;padding-left:18px;font-size:13px;color:var(--ink2)}
.steps li{margin-bottom:6px}
.mono{font-family:ui-monospace,monospace;font-size:11.5px;background:var(--canvas);padding:1px 5px;border-radius:5px}
.empty{text-align:center;padding:56px 20px;color:var(--ink3)}
.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:5px}

@media(max-width:900px){
  .app{grid-template-columns:1fr;margin:0;border-radius:0;min-height:100vh}
  .rail{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:12px}
  .brand,.navlab,.railfoot{display:none}
  .nav{width:auto;white-space:nowrap}
  .body,.top,.filters{padding-left:14px;padding-right:14px}
}
@media print{
  body{background:#fff}
  .app{box-shadow:none;margin:0;border-radius:0;grid-template-columns:1fr}
  .rail,.actions,.filters{display:none}
  .tablewrap{max-height:none;overflow:visible}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>
<div class="app">

  <aside class="rail">
    <div class="brand">
      <div class="mark">BH</div>
      <div><b>Behaviour</b><span id="brandSub">Live dashboard</span></div>
    </div>
    <div class="navlab">Analysis</div>
    <nav id="nav"></nav>
    <div class="railfoot">
      <div class="st"><span class="dot" id="statusDot"></span><span id="statusText">Loading…</span></div>
      <p id="statusRows"></p>
      <button class="btn" style="width:100%;justify-content:center" id="btnRefresh">Refresh data</button>
    </div>
  </aside>

  <main>
    <div class="top">
      <div>
        <h1 id="viewTitle">Behaviour by week</h1>
        <p id="viewSub">Loading…</p>
      </div>
      <div class="grow"></div>
      <div class="actions">
        <button class="btn" id="btnExport">Export CSV</button>
        <button class="btn" id="btnPrint">Print</button>
      </div>
    </div>

    <div class="filters" id="filters">
      <div class="sel"><select id="fPeriod">
        <option value="ayear" selected>Academic year</option>
        <option value="84">Last 12 weeks</option>
        <option value="28">Last 4 weeks</option>
        <option value="all">All data</option>
      </select></div>
      <div class="sel"><select id="fYear"></select></div>
      <div class="sel"><select id="fHouse"></select></div>
      <div class="sel"><select id="fSubject"></select></div>
      <div class="sel"><select id="fLesson"></select></div>
      <div class="divider"></div>
      <div id="cohortPills"></div>
      <div class="divider"></div>
      <button class="btn" id="btnReset">Reset</button>
    </div>

    <div class="body" id="view"></div>
  </main>
</div>

<script>
"use strict";
/* =========================================================================
   Behaviour dashboard — single file. Reads a published Google Sheet as CSV.
   ========================================================================= */

const STORE_KEY='behaviour_dash_v2';
/* Built-in sheet. Anything entered in Data source overrides it for that
   browser only; "Use built-in sheet" reverts. */
const DEFAULT_URL='https://docs.google.com/spreadsheets/d/e/2PACX-1vRO9GAdCbAxrIQfg4ClZRL3I2lS5pzjdjUkhvtjNCNs5h3Dv6ycE_iaebftrzOYiwsU82sgXZc_wC65/pub?gid=0&single=true&output=csv';

const SEV_COLORS=['#F6C97A','#F2A93B','#E88652','#E2574C','#B03030'];
const SEV_LABELS=['-1','-2','-3','-4','-5'];

const COHORTS=[
  {id:'pp',   label:'PP',      test:r=>r.pp},
  {id:'senk', label:'SEN K',   test:r=>r.sen==='K'},
  {id:'ehcp', label:'EHCP',    test:r=>r.sen==='E'},
  {id:'eal',  label:'EAL',     test:r=>r.eal},
  {id:'lac',  label:'LAC',     test:r=>r.lac},
  {id:'male', label:'Male',    test:r=>r.gender==='Male'},
  {id:'female',label:'Female', test:r=>r.gender==='Female'}
];
const VIEWS=[
  {id:'matrix',  title:'Behaviour by week',  sub:'Every behaviour type across the weeks of the year', icon:'grid'},
  {id:'overview',title:'Overview',           sub:'Volume, severity and where it is concentrated',     icon:'chart'},
  {id:'cohorts', title:'Cohorts',            sub:'How groups compare on volume and severity',         icon:'users'},
  {id:'subjects',title:'Subjects & lessons',  sub:'Where in the timetable incidents land',             icon:'book'},
  {id:'data',    title:'Data source',        sub:'Connect a sheet, upload a CSV, check the mapping',   icon:'plug'}
];
const ICONS={
  grid:'<path d="M3 3h7v7H3zM14 3h7v7h-7zM3 14h7v7H3zM14 14h7v7h-7z"/>',
  chart:'<path d="M3 3v18h18"/><path d="M7 15l4-5 3 3 5-7"/>',
  users:'<path d="M17 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9.5" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.9"/>',
  book:'<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>',
  plug:'<path d="M9 2v6M15 2v6"/><path d="M6 8h12v4a6 6 0 0 1-12 0z"/><path d="M12 18v4"/>',
  flag:'<path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><path d="M4 22v-7"/>',
  alert:'<path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/>',
  user:'<path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>',
  pulse:'<path d="M22 12h-4l-3 9L9 3l-3 9H2"/>'
};

const state={rows:[],filtered:[],view:'matrix',url:'',source:'',loadedAt:null,
  cohorts:new Set(),metric:'count',sort:'total',search:''};

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>(n==null||isNaN(n))?'–':Number(n).toLocaleString('en-GB');
const pct=(a,b)=>b?Math.round(a/b*1000)/10:0;
const icon=n=>'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">'+ICONS[n]+'</svg>';
function store(k,v){try{const o=JSON.parse(localStorage.getItem(STORE_KEY)||'{}');if(v===undefined)return o[k];o[k]=v;localStorage.setItem(STORE_KEY,JSON.stringify(o));}catch(e){return undefined;}}
function mondayOf(d){const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-((x.getDay()+6)%7));return x;}
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const ddmm=d=>String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0');
const points=rows=>rows.reduce((s,r)=>s+r.sev,0);
function bySeverity(rows){const a=[0,0,0,0,0];rows.forEach(r=>a[r.sev-1]++);return a;}
function groupBy(rows,fn){const m=new Map();rows.forEach(r=>{const k=fn(r)||'–';if(!m.has(k))m.set(k,[]);m.get(k).push(r);});return m;}
function academicStart(d){return new Date(d.getMonth()>=8?d.getFullYear():d.getFullYear()-1,8,1);}
function weekNo(d){return Math.floor((mondayOf(d)-mondayOf(academicStart(d)))/604800000)+1;}

/* ---------- column matching ---------- */
const key=s=>String(s||'').toLowerCase().replace(/[^a-z0-9]/g,'');
const FIELDS={
  id:['studentid','pupilid','id','upn','studentref','student'],
  when:['datetime','date','datetimeofincident','timestamp','incidentdate','dateandtime'],
  sev:['severity','severitypoints','points','score','behaviourpoints'],
  type:['behaviourtype','behaviour','incidenttype','type','reason','description'],
  year:['studentyear','year','yeargroup','yr','nc'],
  reg:['studentreg','reg','form','formgroup','tutorgroup','registrationgroup','class'],
  house:['studenthouse','house'],
  gender:['studentgender','gender','sex'],
  sen:['studentsenstatus','senstatus','sen','send','senprovision'],
  pp:['studentpupilpremiumstatus','pupilpremiumstatus','pupilpremium','pp','disadvantaged','fsm'],
  eal:['studentealstatus','ealstatus','eal'],
  lac:['studentlookedafterstatus','lookedafterstatus','lookedafter','lac','cla','cic'],
  lesson:['lesson','period','lessonperiod'],
  subject:['subject','course'],
  staff:['staffinvolved','staff','teacher','staffmember','loggedby']
};
let HEADER_MAP={};
function mapHeaders(headers){
  const map={},used=new Set();
  const norm=headers.map(h=>({raw:h,k:key(h)}));
  for(const f in FIELDS){
    let hit=norm.find(h=>!used.has(h.raw)&&FIELDS[f].includes(h.k));
    if(!hit) hit=norm.find(h=>!used.has(h.raw)&&FIELDS[f].some(a=>h.k.includes(a)&&a.length>3));
    if(hit){map[f]=hit.raw;used.add(hit.raw);}
  }
  return map;
}
const NEGATIVE=new Set(['','n','no','none','false','0','-','na','n/a','null','nil']);
const isYes=v=>!NEGATIVE.has(key(v));
function senBand(v){const k=key(v);if(!k||NEGATIVE.has(k))return '';
  if(k==='e'||k.includes('ehcp')||k.includes('statement'))return 'E';return 'K';}
function parseDate(v){
  if(v instanceof Date)return isNaN(v)?null:v;
  const s=String(v||'').trim();if(!s)return null;
  let m=s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})(?:[ T](\d{1,2}):(\d{2}))?/);
  if(m){let y=+m[3];if(y<100)y+=2000;return new Date(y,+m[2]-1,+m[1],+(m[4]||0),+(m[5]||0));}
  m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})(?:[ T](\d{1,2}):(\d{2}))?/);
  if(m)return new Date(+m[1],+m[2]-1,+m[3],+(m[4]||0),+(m[5]||0));
  const d=new Date(s);return isNaN(d)?null:d;
}
function ingest(raw){
  if(!raw.length) throw new Error('The sheet came back empty.');
  const map=mapHeaders(Object.keys(raw[0])); HEADER_MAP=map;
  if(!map.when||!map.sev) throw new Error('Could not find a date column and a severity column. Check that row 1 of the sheet holds the headers.');
  const out=[];
  for(const r of raw){
    const d=parseDate(r[map.when]); if(!d) continue;
    let sev=Math.abs(parseFloat(String(r[map.sev]).replace(/[^0-9.\-]/g,'')));
    if(!isFinite(sev)||sev===0)sev=1;
    sev=Math.min(5,Math.max(1,Math.round(sev)));
    const g=key(r[map.gender]);
    out.push({id:String(r[map.id]||'unknown').trim(),date:d,week:iso(mondayOf(d)),wk:weekNo(d),sev,
      type:(r[map.type]||'Not recorded').toString().trim()||'Not recorded',
      year:(r[map.year]||'').toString().trim().replace(/^year\s*/i,'')||'–',
      reg:(r[map.reg]||'–').toString().trim(),
      house:(r[map.house]||'–').toString().trim(),
      gender:g.startsWith('m')?'Male':(g.startsWith('f')||g.startsWith('w'))?'Female':'Other',
      sen:senBand(r[map.sen]),pp:isYes(r[map.pp]),eal:isYes(r[map.eal]),lac:isYes(r[map.lac]),
      lesson:(r[map.lesson]||'–').toString().trim(),
      subject:(r[map.subject]||'–').toString().trim(),
      staff:(r[map.staff]||'–').toString().trim()});
  }
  if(!out.length) throw new Error('No rows had a readable date.');
  out.sort((a,b)=>a.date-b.date);
  state.rows=out;
}

/* ---------- loading ---------- */
function normaliseSheetUrl(u){
  u=(u||'').trim(); if(!u) return '';
  if(/output=csv/.test(u)) return u;
  const m=u.match(/\/spreadsheets\/d\/([a-zA-Z0-9-_]+)/);
  if(m){const gid=(u.match(/[#&?]gid=(\d+)/)||[])[1]||'0';
    return 'https://docs.google.com/spreadsheets/d/'+m[1]+'/gviz/tq?tqx=out:csv&gid='+gid;}
  return u;
}
function setStatus(kind,text,extra){
  $('#statusDot').className='dot '+kind;
  $('#statusText').textContent=text;
  $('#statusRows').textContent=extra||'';
}
function msg(kind,text){const m=$('#setupMsg'); if(!m) return; m.className='msg show '+kind; m.textContent=text;}

async function loadFromUrl(url){
  const target=normaliseSheetUrl(url);
  if(!target){msg('err','Paste a published sheet link first.');return;}
  setStatus('warn','Loading…','');
  try{
    const res=await fetch(target,{cache:'no-store'});
    if(res.status===401||res.status===403) throw new Error('Google refused the request ('+res.status+'). The sheet is not published to the web, or your Workspace blocks publishing outside the organisation.');
    if(!res.ok) throw new Error('The sheet responded with '+res.status+'.');
    const text=await res.text();
    if(/<html/i.test(text.slice(0,200))) throw new Error('That link returned a web page rather than CSV. Use File → Share → Publish to web and choose CSV.');
    parseText(text,'Google Sheet');
    state.url=url; store('url',url===DEFAULT_URL?'':url);
    msg('ok','Connected — '+fmt(state.rows.length)+' incidents loaded.');
  }catch(e){
    const netFail=/Failed to fetch|NetworkError|CORS/i.test(e.message);
    const isFile=location.protocol==='file:';
    const hadData=state.rows.length>0;
    setStatus('err',hadData?'Refresh failed — showing last load':'No data loaded','');
    if(!hadData){ state.view='data'; }
    render();
    let why=e.message;
    if(netFail&&isFile) why='This page is open straight from your hard drive (a file:// address), and browsers block that from fetching remote data. '+
      'Either use "Upload CSV" below, or put this file on a web address (SharePoint, a staff intranet page, GitHub Pages) and it will connect on its own.';
    else if(netFail) why='Could not reach the sheet. Check the link is published to the web and that you have pasted the CSV link, not the /edit link.';
    msg('err',why);
  }
}
function parseText(text,source){
  const parsed=Papa.parse(text.trim(),{header:true,skipEmptyLines:true});
  ingest(parsed.data);
  state.source=source; state.loadedAt=new Date();
  setStatus('on',state.source,fmt(state.rows.length)+' incidents · '+fmt(new Set(state.rows.map(r=>r.id)).size)+
    ' pupils · updated '+state.loadedAt.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}));
  buildFilterOptions();
  render();
}

  const houses=['Aurora','Meridian','Solstice','Zenith'],letters=['B','G','R','Y'];
  const pupils=[];
  for(let y=7;y<=11;y++)for(let i=0;i<190;i++)pupils.push({
    id:'P'+String(pupils.length+1).padStart(4,'0'),year:String(y),reg:y+letters[i%4],house:houses[i%4],
    gender:Math.random()<0.51?'Male':'Female',sen:Math.random()<0.035?'E':(Math.random()<0.13?'K':''),
    pp:Math.random()<0.42,eal:Math.random()<0.16,lac:Math.random()<0.018,rate:Math.pow(Math.random(),3.1)});

    if(mo===7||(mo===11&&d.getDate()>19)||(mo===0&&d.getDate()<5)) continue;
    const seasonal=1+0.25*Math.sin((d-start)/86400000/30);
    for(const p of pupils){
      let l=p.rate*0.85*yw[p.year]*seasonal;
      if(p.pp)l*=1.35; if(p.sen==='K')l*=1.5; if(p.sen==='E')l*=1.8;
      if(p.gender==='Male')l*=1.3; if(p.lac)l*=1.4;
      if(Math.random()>l*0.11) continue;

      rows.push({'Student ID':p.id,'Date/Time':iso(d)+' '+(9+Math.floor(Math.random()*6))+':'+String(Math.floor(Math.random()*60)).padStart(2,'0'),

        'Subject':subjects[Math.floor(Math.random()*subjects.length)],'Staff Involved':staff[Math.floor(Math.random()*staff.length)]});
    }
  }
  ingest(rows); state.source='Sample data'; state.loadedAt=new Date();
  setStatus('warn','Sample data',fmt(state.rows.length)+' invented incidents — nothing here is real');
  buildFilterOptions(); render();
  msg('ok','Sample data loaded — '+fmt(state.rows.length)+' invented incidents.');
}

/* ---------- filters ---------- */
function opts(sel,values,label){
  const el=$(sel),cur=el.value;
  el.innerHTML='<option value="">'+label+'</option>'+values.map(v=>'<option>'+esc(v)+'</option>').join('');
  if(values.includes(cur))el.value=cur;
}
const uniq=fn=>[...new Set(state.rows.map(fn).filter(v=>v&&v!=='–'))].sort((a,b)=>String(a).localeCompare(String(b),'en',{numeric:true}));
function buildFilterOptions(){
  opts('#fYear',uniq(r=>r.year).map(y=>'Year '+y),'All years');
  opts('#fHouse',uniq(r=>r.house),'All houses');
  opts('#fSubject',uniq(r=>r.subject),'All subjects');
  opts('#fLesson',uniq(r=>r.lesson),'All lessons');
}
function renderPills(){
  $('#cohortPills').innerHTML=COHORTS.map(c=>'<button class="pill" data-c="'+c.id+'" aria-pressed="'+
    state.cohorts.has(c.id)+'">'+c.label+'</button>').join(' ');
  $('#cohortPills').querySelectorAll('.pill').forEach(b=>b.onclick=()=>{
    const id=b.dataset.c;
    state.cohorts.has(id)?state.cohorts.delete(id):state.cohorts.add(id);
    render();
  });
}
function periodBounds(){
  let p=$('#fPeriod').value||'ayear';
  if(p!=='all'&&p!=='ayear'&&!(+p>0))p='ayear';
  const last=state.rows.length?state.rows[state.rows.length-1].date:new Date();
  const end=new Date(last.getFullYear(),last.getMonth(),last.getDate(),23,59,59);
  if(p==='all')return [state.rows.length?state.rows[0].date:new Date(end.getFullYear(),0,1),end];
  if(p==='ayear')return [academicStart(end),end];
  const from=new Date(end);from.setDate(from.getDate()-(+p)+1);from.setHours(0,0,0,0);
  return [from,end];
}
function applyFilters(){
  const [from,to]=periodBounds();
  const yr=($('#fYear').value||'').replace('Year ','');
  const house=$('#fHouse').value,subject=$('#fSubject').value,lesson=$('#fLesson').value;
  const tests=[...state.cohorts].map(id=>COHORTS.find(c=>c.id===id).test);
  state.filtered=state.rows.filter(r=>{
    if(r.date<from||r.date>to)return false;
    if(yr&&r.year!==yr)return false;
    if(house&&r.house!==house)return false;
    if(subject&&r.subject!==subject)return false;
    if(lesson&&r.lesson!==lesson)return false;
    for(const t of tests) if(!t(r)) return false;
    return true;
  });
}
function filterSummary(){
  const bits=[];
  const yr=$('#fYear').value,house=$('#fHouse').value,subject=$('#fSubject').value,lesson=$('#fLesson').value;
  if(yr)bits.push(yr); if(house)bits.push(house+' house'); if(subject)bits.push(subject); if(lesson)bits.push(lesson);
  [...state.cohorts].forEach(id=>bits.push(COHORTS.find(c=>c.id===id).label));
  return bits.length?bits.join(' · '):'All pupils';
}

/* ---------- small charts ---------- */
function sparkline(values,colour,fill,height){
  if(!values.length)return '';
  const H0=height||54;
  const W=260,H=54,max=Math.max(...values,1);
  const step=values.length>1?W/(values.length-1):W;
  const pts=values.map((v,i)=>[i*step,H-4-(v/max)*(H-10)]);
  const line=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  return '<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" style="display:block;width:100%;height:'+H0+'px" aria-hidden="true">'+
    '<path d="'+line+' L'+W+' '+H+' L0 '+H+' Z" fill="'+fill+'"/>'+
    '<path d="'+line+'" fill="none" stroke="'+colour+'" stroke-width="2" stroke-linejoin="round"/></svg>';
}
function areaChart(data){
  if(!data.length)return '<p style="color:var(--ink3);font-size:13px">No incidents in this view.</p>';
  const W=1000,H=250,L=40,R=14,T=12,B=34,iw=W-L-R,ih=H-T-B;
  const max=Math.max(...data.map(d=>d.total),1);
  const step=data.length>1?iw/(data.length-1):iw;
  const x=i=>L+i*step, y=v=>T+ih-(v/max)*ih;
  const line=data.map((d,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(d.total).toFixed(1)).join(' ');
  let s='<svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="Incidents per week">';
  s+='<defs><linearGradient id="ag" x1="0" y1="0" x2="0" y2="1">'+
     '<stop offset="0%" stop-color="#3A6FF7" stop-opacity=".28"/><stop offset="100%" stop-color="#3A6FF7" stop-opacity="0"/></linearGradient></defs>';
  for(let g=0;g<=3;g++){const v=max*g/3,yy=y(v);
    s+='<line x1="'+L+'" y1="'+yy+'" x2="'+(W-R)+'" y2="'+yy+'" stroke="#EAEDF5"/>'+
       '<text x="'+(L-8)+'" y="'+(yy+4)+'" text-anchor="end" font-size="11" fill="#98A1B8">'+Math.round(v)+'</text>';}
  s+='<path d="'+line+' L'+x(data.length-1)+' '+(T+ih)+' L'+L+' '+(T+ih)+' Z" fill="url(#ag)"/>';
  s+='<path d="'+line+'" fill="none" stroke="#3A6FF7" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>';
  data.forEach((d,i)=>{
    s+='<circle cx="'+x(i)+'" cy="'+y(d.total)+'" r="3" fill="#fff" stroke="#3A6FF7" stroke-width="2"><title>Week '+d.wk+' ('+d.label+'): '+d.total+'</title></circle>';
    if(i%Math.ceil(data.length/14||1)===0)
      s+='<text x="'+x(i)+'" y="'+(H-B+20)+'" text-anchor="middle" font-size="10.5" fill="#98A1B8">W'+d.wk+'</text>';});
  return s+'</svg>';
}
function donut(values,labels,colours){
  const total=values.reduce((a,b)=>a+b,0)||1;
  const R=64,r=42,C=90;let a0=-Math.PI/2,s='<svg viewBox="0 0 180 180" width="180" height="180" role="img" aria-label="Severity mix">';
  values.forEach((v,i)=>{
    if(!v)return;
    const a1=a0+(v/total)*Math.PI*2, big=(a1-a0)>Math.PI?1:0;
    const p=(rad,ang)=>[(C+rad*Math.cos(ang)).toFixed(2),(C+rad*Math.sin(ang)).toFixed(2)];
    const [x0,y0]=p(R,a0),[x1,y1]=p(R,a1),[x2,y2]=p(r,a1),[x3,y3]=p(r,a0);
    s+='<path d="M'+x0+' '+y0+' A'+R+' '+R+' 0 '+big+' 1 '+x1+' '+y1+' L'+x2+' '+y2+' A'+r+' '+r+' 0 '+big+' 0 '+x3+' '+y3+' Z" '+
       'fill="'+colours[i]+'"><title>'+labels[i]+': '+v+' ('+pct(v,total)+'%)</title></path>';
    a0=a1;});
  return s+'</svg>';
}

/* ---------- the heat matrix ---------- */
function heatStyle(v,scaleMax){
  if(!v)return 'color:#C9CFDD';
  const t=Math.min(1,v/scaleMax);
  const a=(0.07+Math.pow(t,0.75)*0.88).toFixed(3);
  return 'background:rgba(var(--heat),'+a+');'+(a>0.55?'color:#fff':'color:var(--ink)');
}
function matrixData(){
  const rows=state.filtered;
  const weeks=[...new Set(rows.map(r=>r.wk))].sort((a,b)=>a-b);
  const weekDate={}; rows.forEach(r=>{weekDate[r.wk]=r.week;});
  const map=new Map();
  rows.forEach(r=>{
    if(!map.has(r.type))map.set(r.type,{cells:{},total:0,count:0,pupils:new Set(),points:0});
    const e=map.get(r.type);
    const add=state.metric==='points'?r.sev:1;
    e.cells[r.wk]=(e.cells[r.wk]||0)+add; e.total+=add; e.count++; e.points+=r.sev; e.pupils.add(r.id);
  });
  let types=[...map.entries()];
  if(state.search){const q=state.search.toLowerCase();types=types.filter(t=>t[0].toLowerCase().includes(q));}
  types.sort(state.sort==='name'?(a,b)=>a[0].localeCompare(b[0])
    :state.sort==='recent'?(a,b)=>(b[1].cells[weeks[weeks.length-1]]||0)-(a[1].cells[weeks[weeks.length-1]]||0)
    :(a,b)=>b[1].total-a[1].total);
  return {weeks,types,weekDate};
}

  if(!state.rows.length)return emptyState();

  if(!types.length)return '<div class="card"><div class="empty"><b>Nothing matches these filters</b>Try clearing a filter or widening the period.</div></div>';
  const all=[];types.forEach(([,e])=>weeks.forEach(w=>{if(e.cells[w])all.push(e.cells[w]);}));
  all.sort((a,b)=>a-b);
  const scaleMax=Math.max(all[Math.floor(all.length*0.92)]||1,1);
  const colTot={};weeks.forEach(w=>{colTot[w]=types.reduce((s,[,e])=>s+(e.cells[w]||0),0);});
  const grand=types.reduce((s,[,e])=>s+e.total,0);
  const unit=state.metric==='points'?'severity points':'incidents';

  let h='<div class="card">'+
    '<div class="ch"><div style="flex:1"><h2>Behaviour type by week</h2>'+

    '<div class="searchbox"><svg viewBox="0 0 24 24" fill="none" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>'+

    '<div class="sel"><select id="mMetric"><option value="count"'+(state.metric==='count'?' selected':'')+'>Count of incidents</option>'+
    '<option value="points"'+(state.metric==='points'?' selected':'')+'>Severity points</option></select></div>'+
    '<div class="sel"><select id="mSort"><option value="total"'+(state.sort==='total'?' selected':'')+'>Sort: highest total</option>'+
    '<option value="recent"'+(state.sort==='recent'?' selected':'')+'>Sort: latest week</option>'+
    '<option value="name"'+(state.sort==='name'?' selected':'')+'>Sort: A–Z</option></select></div></div>';

  h+='<div class="tablewrap"><table class="matrix"><thead><tr><th class="name">Behaviour type</th>'+
    weeks.map(w=>'<th title="Week commencing '+(weekDate[w]?ddmm(new Date(weekDate[w])):'')+'">W'+w+'</th>').join('')+
    '<th class="tot">Total</th><th class="tot">Trend</th></tr></thead><tbody>';
  types.forEach(([name,e])=>{
    h+='<tr><td class="name" title="'+esc(name)+'">'+esc(name)+
      '<small>'+fmt(e.count)+' incidents · '+fmt(e.pupils.size)+' pupils · mean -'+(e.points/e.count).toFixed(1)+'</small></td>';
    weeks.forEach(w=>{const v=e.cells[w]||0;
      h+='<td style="'+heatStyle(v,scaleMax)+'" title="'+esc(name)+' · week '+w+': '+v+'"><span class="cellv">'+(v||'')+'</span></td>';});
    h+='<td class="tot">'+fmt(e.total)+'</td><td class="tot trendcell">'+

  h+='</tbody></table></div>';
  h+='<div style="display:flex;justify-content:space-between;align-items:center;gap:16px;margin-top:14px;flex-wrap:wrap">'+
    '<div class="scale"><span>Fewer</span>'+[0.06,0.25,0.45,0.65,0.85,1].map(t=>
      '<i style="background:rgba(var(--heat),'+(0.07+Math.pow(t,0.75)*0.88).toFixed(2)+')"></i>').join('')+'<span>More</span></div>'+
    '<p style="margin:0;font-size:11.5px;color:var(--ink3)">Week numbers run from the start of the academic year. Hover any cell for the exact figure.</p></div>';
  return h+'</div>';

      '<span style="font-size:12.5px;font-weight:600;flex:1">'+SEV_LABELS[i]+'</span>'+
      '<span style="font-size:12.5px;font-weight:700" class="num">'+fmt(v)+'</span>'+
      '<span style="font-size:11.5px;color:var(--ink3);width:42px;text-align:right" class="num">'+pct(v,cur.length)+'%</span></div>').join('')+
    '</div></div></div></div>';

  h+='<div class="grid g2" style="margin-top:16px">'+panelTop('Top behaviour types',groupBy(cur,r=>r.type),10)+
     panelTop('Most affected subjects',groupBy(cur,r=>r.subject),10)+'</div>';
  return h;
}
function panelTop(title,map,n){
  const entries=[...map.entries()].filter(e=>e[0]!=='–').sort((a,b)=>b[1].length-a[1].length).slice(0,n);
  const max=Math.max(...entries.map(e=>e[1].length),1);
  return '<div class="card"><div class="ch"><div><h2>'+title+'</h2><p>Ranked by volume, with mean severity</p></div></div>'+
    (entries.length?'<table class="data"><tbody>'+entries.map(([k,rows])=>
      '<tr><td style="max-width:210px">'+esc(k)+'</td>'+
      '<td style="width:44%"><div class="track"><span style="width:'+(rows.length/max*100)+'%"></span></div></td>'+
      '<td class="num" style="width:52px">'+fmt(rows.length)+'</td>'+
      '<td class="num" style="width:46px;color:var(--ink3)">-'+(points(rows)/rows.length).toFixed(1)+'</td></tr>').join('')+
      '</tbody></table>':'<p style="color:var(--ink3);font-size:13px">Nothing recorded.</p>')+'</div>';
}

/* ---------- cohorts ---------- */
function viewCohorts(){
  if(!state.rows.length)return emptyState();
  const all=state.filtered;
  const rowsFor=(label,test)=>{
    const rr=all.filter(test),pupils=new Set(rr.map(r=>r.id)).size;
    const sev=bySeverity(rr),tot=rr.length||1;
    const mix=sev.map((n,i)=>n?'<i style="background:'+SEV_COLORS[i]+';width:'+(n/tot*100)+'%"></i>':'').join('');
    return '<tr><td>'+label+'</td><td class="num">'+fmt(rr.length)+'</td><td class="num">'+pct(rr.length,all.length)+'%</td>'+
      '<td class="num">'+fmt(pupils)+'</td><td class="num">'+(rr.length?fmt(Math.round(rr.length/pupils*10)/10):'–')+'</td>'+
      '<td class="num">'+(rr.length?'-'+(points(rr)/rr.length).toFixed(1):'–')+'</td>'+
      '<td class="num">'+pct(rr.filter(r=>r.sev>=4).length,rr.length)+'%</td>'+
      '<td><span class="mix">'+mix+'</span></td></tr>';
  };
  let h='<div class="card"><div class="ch"><div><h2>Cohort comparison</h2>'+
    '<p>'+esc(filterSummary())+' · counts are incidents, not pupils, unless the column says otherwise</p></div></div>'+
    '<table class="data"><thead><tr><th>Group</th><th>Incidents</th><th>Share</th><th>Pupils</th>'+
    '<th>Per pupil</th><th>Mean severity</th><th>% serious</th><th style="text-align:right">Severity mix</th></tr></thead><tbody>'+
    COHORTS.map(c=>rowsFor(c.label,c.test)).join('')+
    rowsFor('<b>All pupils</b>',()=>true)+'</tbody></table>'+
    '<p style="margin:14px 0 0;font-size:11.5px;color:var(--ink3)">Shares are of incidents in this view. Groups overlap — a pupil can be PP and SEN.</p></div>';

  const years=[...groupBy(all,r=>r.year).entries()].filter(e=>e[0]!=='–')
    .sort((a,b)=>String(a[0]).localeCompare(String(b[0]),'en',{numeric:true}));
  const maxY=Math.max(...years.map(e=>e[1].length),1);
  h+='<div class="grid g2" style="margin-top:16px"><div class="card">'+
    '<div class="ch"><div><h2>By year group</h2><p>Volume and severity side by side</p></div></div>'+
    '<table class="data"><thead><tr><th>Year</th><th>Incidents</th><th style="width:38%">Share</th><th>Pupils</th><th>Mean</th></tr></thead><tbody>'+
    years.map(([y,rr])=>'<tr><td>Year '+esc(y)+'</td><td class="num">'+fmt(rr.length)+'</td>'+
      '<td><div class="track"><span style="width:'+(rr.length/maxY*100)+'%"></span></div></td>'+
      '<td class="num">'+fmt(new Set(rr.map(r=>r.id)).size)+'</td>'+
      '<td class="num" style="color:var(--ink3)">-'+(points(rr)/rr.length).toFixed(1)+'</td></tr>').join('')+
    '</tbody></table></div>'+
    panelTop('By house',groupBy(all,r=>r.house),8)+'</div>';
  return h;
}

/* ---------- subjects ---------- */
function viewSubjects(){
  if(!state.rows.length)return emptyState();
  const all=state.filtered;
  const years=[...new Set(all.map(r=>r.year))].filter(y=>y!=='–').sort((a,b)=>String(a).localeCompare(String(b),'en',{numeric:true}));
  const subjects=[...groupBy(all,r=>r.subject).entries()].filter(e=>e[0]!=='–').sort((a,b)=>b[1].length-a[1].length);
  const cell={};all.forEach(r=>{if(r.subject==='–')return;cell[r.subject+'|'+r.year]=(cell[r.subject+'|'+r.year]||0)+1;});
  const vals=Object.values(cell).sort((a,b)=>a-b);
  const scaleMax=Math.max(vals[Math.floor(vals.length*0.92)]||1,1);
  let h='<div class="card"><div class="ch"><div><h2>Subject by year group</h2>'+
    '<p>'+esc(filterSummary())+' · shading is relative to the busiest cells</p></div></div>'+
    '<div class="tablewrap"><table class="matrix"><thead><tr><th class="name">Subject</th>'+
    years.map(y=>'<th>Year '+esc(y)+'</th>').join('')+'<th class="tot">Total</th></tr></thead><tbody>';
  subjects.forEach(([s,rr])=>{
    h+='<tr><td class="name">'+esc(s)+'<small>mean -'+(points(rr)/rr.length).toFixed(1)+'</small></td>'+
      years.map(y=>{const v=cell[s+'|'+y]||0;
        return '<td style="'+heatStyle(v,scaleMax)+'"><span class="cellv">'+(v||'')+'</span></td>';}).join('')+
      '<td class="tot">'+fmt(rr.length)+'</td></tr>';});
  h+='</tbody></table></div></div>';
  h+='<div class="grid g2" style="margin-top:16px">'+
    panelTop('By lesson period',groupBy(all,r=>r.lesson),8)+
    panelTop('Staff involved',groupBy(all,r=>r.staff),12)+'</div>';
  return h;
}

/* ---------- data source ---------- */
function viewData(){
  const mapped=Object.keys(HEADER_MAP).length;
  return '<div class="grid g2"><div class="card">'+
    '<div class="ch"><div><h2>Connect a sheet</h2><p>A published Google Sheet is built in. Point it elsewhere or load a CSV.</p></div></div>'+
    '<ol class="steps">'+
      '<li>In the sheet: <b>File → Share → Publish to web</b>, pick the data tab, choose <b>Comma-separated values (.csv)</b>, publish.</li>'+
      '<li>Paste the link below. A normal <span class="mono">/edit</span> link works too.</li>'+
      '<li>Row 1 must hold the headers. Column order does not matter.</li>'+
    '</ol>'+
    '<div class="field"><label for="sheetUrl">Sheet URL &mdash; '+
      (state.url===DEFAULT_URL?'built in':'saved on this browser')+'</label>'+
    '<input type="text" id="sheetUrl" value="'+esc(state.url||DEFAULT_URL)+'"></div>'+
    '<div style="display:flex;gap:8px;flex-wrap:wrap">'+
      '<button class="btn pri" id="btnConnect">Connect</button>'+
      '<button class="btn" id="btnFile">Upload CSV</button>'+
      '<input type="file" id="fileInput" accept=".csv,text/csv" hidden>'+
      '<button class="btn" id="btnDemo">Load sample data</button>'+
      '<button class="btn" id="btnBuiltin">Use built-in sheet</button>'+
    '</div><div class="msg" id="setupMsg"></div></div>'+

    '<div class="card"><div class="ch"><div><h2>Column mapping</h2>'+
    '<p>'+(mapped?'What the dashboard found in your sheet':'Load some data to see how your columns were read')+'</p></div></div>'+
    (mapped?'<table class="data"><thead><tr><th>Field</th><th style="text-align:right">Column in your sheet</th></tr></thead><tbody>'+
      Object.keys(FIELDS).map(f=>'<tr><td>'+f+'</td><td style="color:'+(HEADER_MAP[f]?'var(--ink)':'var(--ink3)')+'">'+
        esc(HEADER_MAP[f]||'not found')+'</td></tr>').join('')+'</tbody></table>'
      :'<p style="color:var(--ink3);font-size:13px">Nothing loaded yet.</p>')+
    '<p style="margin:14px 0 0;font-size:11.5px;color:var(--ink3)">Only date and severity are required. Anything not found is treated as blank.</p>'+
    '</div></div>';
}
function emptyState(){
  return '<div class="card"><div class="empty"><b>No data loaded</b>'+
    'The built-in sheet could not be read. Open <b>Data source</b> to check the link, or load the sample data to explore the dashboard.'+
    '<div style="margin-top:16px"><button class="btn pri" onclick="document.querySelector(\'[data-v=data]\').click()">Open data source</button></div></div></div>';
}

/* ---------- render ---------- */
function render(){
  applyFilters();
  const v=VIEWS.find(x=>x.id===state.view);
  $('#viewTitle').textContent=v.title;
  const [from,to]=periodBounds();
  $('#viewSub').textContent=state.rows.length
    ? v.sub+' · '+from.toLocaleDateString('en-GB',{day:'numeric',month:'short'})+' to '+to.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})
    : v.sub;
  $('#nav').innerHTML=VIEWS.map(x=>'<button class="nav" data-v="'+x.id+'" aria-current="'+(x.id===state.view)+'">'+
    icon(x.icon)+'<span>'+x.title+'</span></button>').join('');
  $('#nav').querySelectorAll('.nav').forEach(b=>b.onclick=()=>{state.view=b.dataset.v;render();});
  $('#filters').style.display=state.view==='data'?'none':'';
  renderPills();
  $('#view').innerHTML=({matrix:viewMatrix,overview:viewOverview,cohorts:viewCohorts,subjects:viewSubjects,data:viewData})[state.view]();
  wireView();
}
function wireView(){
  const s=$('#mSearch');
  if(s){
    s.oninput=()=>{state.search=s.value;
      const pos=s.selectionStart; render();
      const n=$('#mSearch'); if(n){n.focus();n.setSelectionRange(pos,pos);} };
    $('#mMetric').onchange=e=>{state.metric=e.target.value;render();};
    $('#mSort').onchange=e=>{state.sort=e.target.value;render();};
  }
  const c=$('#btnConnect');
  if(c){
    c.onclick=()=>loadFromUrl($('#sheetUrl').value);
    $('#btnDemo').onclick=demoData;
    $('#btnBuiltin').onclick=()=>{store('url','');$('#sheetUrl').value=DEFAULT_URL;loadFromUrl(DEFAULT_URL);};
    $('#btnFile').onclick=()=>$('#fileInput').click();
    $('#fileInput').onchange=e=>{const f=e.target.files[0];if(!f)return;
      const rd=new FileReader();rd.onload=()=>{try{parseText(rd.result,f.name);msg('ok','Loaded '+fmt(state.rows.length)+' incidents from '+f.name+'.');}
      catch(err){msg('err',err.message);}};rd.readAsText(f);};
  }
}

/* ---------- export ---------- */
function download(name,text){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([text],{type:'text/csv'}));
  a.download=name;a.click();URL.revokeObjectURL(a.href);
}
function exportCsv(){
  if(!state.filtered.length)return;
  const q=v=>'"'+String(v).replace(/"/g,'""')+'"';
  if(state.view==='matrix'){
    const {weeks,types}=matrixData();
    const head=['Behaviour type',...weeks.map(w=>'Week '+w),'Total'];
    const body=types.map(([n,e])=>[n,...weeks.map(w=>e.cells[w]||0),e.total].map(q).join(','));
    download('behaviour-by-week-'+iso(new Date())+'.csv',head.map(q).join(',')+'\n'+body.join('\n'));
    return;
  }
  const head=['Student ID','Date','Time','Severity','Behaviour Type','Year','Reg','House','Gender','SEN','PP','EAL','LAC','Lesson','Subject','Staff'];
  const body=state.filtered.map(r=>[r.id,iso(r.date),r.date.toTimeString().slice(0,5),-r.sev,r.type,r.year,r.reg,r.house,
    r.gender,r.sen||'N',r.pp?'Y':'N',r.eal?'Y':'N',r.lac?'Y':'N',r.lesson,r.subject,r.staff].map(q).join(','));
  download('behaviour-'+state.view+'-'+iso(new Date())+'.csv',head.map(q).join(',')+'\n'+body.join('\n'));
}

/* ---------- wiring ---------- */
['fPeriod','fYear','fHouse','fSubject','fLesson'].forEach(id=>$('#'+id).addEventListener('change',render));
$('#btnReset').onclick=()=>{['fYear','fHouse','fSubject','fLesson'].forEach(i=>$('#'+i).value='');
  $('#fPeriod').value='ayear';state.cohorts.clear();state.search='';render();};
$('#btnExport').onclick=exportCsv;
$('#btnPrint').onclick=()=>window.print();
$('#btnRefresh').onclick=()=>loadFromUrl(state.url||DEFAULT_URL);

/* ---------- boot ---------- */
(function(){
  state.url=store('url')||DEFAULT_URL;
  render();
  loadFromUrl(state.url);
  setInterval(()=>{if(state.url&&document.visibilityState==='visible')loadFromUrl(state.url);},15*60*1000);
})();
</script>
